name: tutorial1

on: push

job1:
  name: job1
  runs-on: ubuntu-latest
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Check Python version
      run: python --version

    - name: step1
      run: echo "Hello from job1"

    - name: Show date
      run: date

  job2:
    name: job2
    runs-on: windows-latest
    steps:
      - name: step2
        run: echo "Hello from job 2"

      - name: Show date
        run: Get-Date
        shell: powershell

  job3:
    runs-on: ubuntu-latest
    steps:
      - name: step3
        run: echo "Hello from job 3"

      - name: Show date
        run: date

  job4:
    needs: [job1, job2]
    name: job4
    runs-on: ubuntu-latest
    steps:
      - name: step4
        run: echo "I am job 4"

      - name: Show date
        run: date